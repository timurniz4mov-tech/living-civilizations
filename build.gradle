plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'ru.livingcivilizations'
version = '0.6.1-beta'
base { archivesName = 'living-civilizations' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { livingcivilizations { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}
tasks.named('processResources', ProcessResources).configure {
    var props = [
        minecraft_version: '1.20.1',
        forge_version: '47.2.0',
        mod_id: 'livingcivilizations',
        mod_name: 'Живые цивилизации',
        mod_version: project.version,
        mod_authors: 'LivingCivilizations',
        mod_description: 'A living medieval world with player-like NPCs, settlements and kingdoms.'
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props + [project: project]
    }
}
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'livingcivilizations',
            'Specification-Vendor': 'LivingCivilizations',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'LivingCivilizations'
        ])
    }
    finalizedBy 'reobfJar'
}
